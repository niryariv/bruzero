<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11121c"><meta name="description" content="ברווזירו: כנפי האופל — קומיקס מאנגה בעברית"><title>ברווזירו — כנפי האופל</title><style>
:root{color-scheme:dark;--bg:#0c0e17;--fg:#f4f1e8;--muted:#adb0bd;--gold:#ffc341}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,Arial,sans-serif}button{cursor:pointer;font:inherit}header{position:sticky;top:0;z-index:4;background:#10121eea;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff22;display:flex;align-items:center;justify-content:space-between;padding:12px max(18px,calc((100vw - 1100px)/2));gap:12px}h1{margin:0;color:var(--gold);font-size:clamp(24px,4vw,37px)}.sub{font-size:12px;color:var(--muted)}.nav{display:flex;gap:7px;flex-wrap:wrap}button{background:#25283b;color:#fff;border:1px solid #4d5168;border-radius:9px;padding:10px 13px}button:hover,button.active{background:#dcae42;color:#111;border-color:#dcae42}main{max-width:1120px;margin:auto;padding:22px 16px 90px}.intro{text-align:center;padding:25px 0 16px}.intro p{color:var(--muted)}.reader{display:flex;flex-direction:column;align-items:center;gap:16px}.reader img{display:block;width:min(100%,790px);height:auto;box-shadow:0 10px 40px #0009;border:1px solid #ffffff22;background:#171822}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.controls button{min-width:115px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px}.tile{padding:0;border:0;background:none;text-align:center}.tile img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;border:1px solid #ffffff22}.tile span{font-size:12px;color:var(--muted)}.note{font-size:13px;color:var(--muted);text-align:center;margin:15px auto 25px;max-width:700px}#lightbox{position:fixed;inset:0;z-index:10;background:#000e;display:none;align-items:center;justify-content:center;padding:10px}#lightbox.open{display:flex}#lightbox img{max-width:100%;max-height:96vh;object-fit:contain}#close{position:absolute;top:12px;left:12px}footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.reader img{width:100%}.gallery{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><h1>ברווזירו</h1><div class="sub">כנפי האופל · BRUZERO</div></div><nav class="nav"><button id="v0" onclick="showVolume(0)">כרך 1</button><button id="v1" onclick="showVolume(1)">כרך 2</button><button id="gallerybtn" onclick="showGallery()">כל העיצובים</button></nav></header><main><section class="intro"><h2 id="heading">כנפי האופל</h2><p id="subtitle">סיפורו של ריו, חליפת הברווז ופרויקט אקליפס</p></section><div id="content"></div></main><footer>ברווזירו · מאנגה מקורית</footer><div id="lightbox" onclick="closeBox()"><button id="close" onclick="closeBox()">סגור ✕</button><img id="big" alt="עמוד קומיקס"></div><script>
let data,volume=0,page=0;const el=document.getElementById('content');fetch('manifest.json').then(r=>r.json()).then(x=>{data=x;showVolume(0)});function active(id){for(const x of ['v0','v1','gallerybtn'])document.getElementById(x).classList.toggle('active',x===id)}function showVolume(n){if(!data)return;volume=n;page=0;active('v'+n);render()}function change(n){const pages=data.volumes[volume].pages;page=Math.max(0,Math.min(pages.length-1,page+n));render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let v=data.volumes[volume];document.getElementById('heading').textContent=v.name;document.getElementById('subtitle').textContent='קריאה מימין לשמאל · '+v.pages.length+' עמודים';el.innerHTML='<div class="reader"><div class="controls"><button onclick="change(-1)">→ הקודם</button><strong>עמוד '+(page+1)+' מתוך '+v.pages.length+'</strong><button onclick="change(1)">הבא ←</button></div><img src="'+v.pages[page]+'" alt="עמוד '+(page+1)+'" onclick="openBox(this.src)"><div class="controls"><button onclick="change(-1)">→ הקודם</button><button onclick="change(1)">הבא ←</button></div></div>'}function showGallery(){if(!data)return;active('gallerybtn');document.getElementById('heading').textContent='גלריית כל העיצובים';document.getElementById('subtitle').textContent=data.gallery.length+' תמונות, כולל סקיצות וגרסאות חלופיות';el.innerHTML='<p class="note">הגלריה כוללת גם גרסאות קודמות ועמודים שנערכו מחדש. הכרכים הם רצף קריאה נבחר.</p><div class="gallery">'+data.gallery.map((x,i)=>'<button class="tile" onclick="openBox(this.querySelector(&quot;img&quot;).src)"><img loading="lazy" src="'+x.src+'" alt="עיצוב '+(i+1)+'"><span>עיצוב '+(i+1)+'</span></button>').join('')+'</div>'}function openBox(src){document.getElementById('big').src=src;document.getElementById('lightbox').classList.add('open')}function closeBox(){document.getElementById('lightbox').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox();else if(e.key==='ArrowLeft'&&data)change(1);else if(e.key==='ArrowRight'&&data)change(-1)})
</script></body></html>
